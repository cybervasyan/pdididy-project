name: Lint Reusable

on:
  workflow_call:
    inputs:
      modules:
        required: true
        type: string
      go-version:
        required: true
        type: string
      golangci-lint-version:
        required: true
        type: string

jobs:
  golangci-lint:
    name: Lint all Go modules
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v6

      - name: 🛠 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: '**/go.sum'

      - name: 🐾 Show go.work (debug)
        run: cat go.work || echo "❗ go.work not found"

      - name: 📌 Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0

      - name: ✅ Run golangci-lint via Taskfile
        env:
          MODULES: ${{ inputs.modules }}
          GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
        run: task lint
